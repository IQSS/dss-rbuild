# Re-execute the R and Python pages on a schedule and report what changed underneath them.
#
# Publishing renders from the committed _freeze/, because no runner has R, Python or Stata. That
# keeps publishing fast and deterministic, but it also means the site can go on serving output that
# current packages would no longer produce. This job is the counterweight: once a quarter it
# installs the locked environments, throws the R and Python freezes away, and re-executes every
# chunk.
#
# It commits nothing and opens nothing. Re-rendering rewrites figure PNGs even when nothing
# meaningful changed, so a pull request would be noise every quarter, and the maintainer did not
# want public issues. Instead the job FAILS when there is something to look at, and GitHub emails
# the failure. The two things it fails on:
#
#   1. the render failed        - a package changed in a way the materials do not survive
#   2. a deprecation was raised - the pages set `warning: false` in their front matter, so these
#                                 are invisible on the site while a reader running the same chunk
#                                 meets them in their own console.
#
# Findings go to both the step log and the run summary. The summary is the readable one, but it
# cannot be fetched from the API, which is how the first failing run left nothing to look at.
#
# There is no Stata or Python here: every chapter is R, so the whole freeze is thrown away and
# rebuilt. See dss-training-ops/docs/notes/annual-bump.md.

name: Drift check

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"   # 06:00 UTC on the first of January, April, July and October
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reexecute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2

      # Show the warnings the pages hide. warning: false sits in each page's YAML
      # front matter, not in _quarto.yml.
      - name: Unhide warnings and messages
        run: |
          sed -i 's/^  warning: false$/  warning: true/; s/^  message: false$/  message: true/' *.qmd
          grep -c 'warning: true' *.qmd || true

      # Every chapter is R, so all of it re-executes.
      - name: Drop the freeze
        run: rm -rf _freeze/integrated-development-environments _freeze/package-development _freeze/version-control

      - name: Re-execute
        id: render
        continue-on-error: true
        run: quarto render 2>&1 | tee render.log

      - name: Report
        run: |
          grep -hoiE "[^<>]{0,80}(is deprecated|was deprecated|deprecated in|superseded|defunct)[^<>]{0,120}" \
            _site/*.html render.log 2>/dev/null \
            | sed 's/&quot;/"/g; s/&#39;/'"'"'/g' | sort -u > findings.txt || true

          echo "--- findings ---"
          cat findings.txt || true
          echo "--- end findings ---"

          {
            echo "## Drift check"
            echo
            echo "Render outcome: **${{ steps.render.outcome }}**"
            echo
            if [ -s findings.txt ]; then
              echo "### Deprecations raised on re-execution"
              echo
              echo '```'
              head -40 findings.txt
              echo '```'
            else
              echo "No deprecations raised."
            fi
            echo
            echo "Publishing is unaffected — the site still renders from the committed freeze."
            echo "To act on this, re-render locally where R is installed and commit the freeze."
            echo "See dss-training-ops/docs/notes/annual-bump.md."
            if [ "${{ steps.render.outcome }}" = "failure" ]; then
              echo
              echo "<details><summary>Render log, last 60 lines</summary>"
              echo
              echo '```'
              tail -60 render.log
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.render.outcome }}" = "failure" ]; then
            echo "::error::Re-execution failed; see the run summary."
            exit 1
          fi
          if [ -s findings.txt ]; then
            echo "::error::$(wc -l < findings.txt) deprecation(s) raised; see the run summary."
            exit 1
          fi
          echo "Nothing to report."
