# Render the site from the committed _freeze/ (no R on the runner) and publish it to the gh-pages branch.
# Runs on every push to main, and by hand from the Actions tab.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"
      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
