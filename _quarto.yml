# Package Development in R (dss-rbuild): a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Five pages named after the 2019 bookdown pages, so every old address still answers. The five chunks that run
# (an R version, a function, three testthat expectations) are frozen; CI renders from _freeze/ with no R.
project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - package-development.qmd
    - version-control.qmd
    - integrated-development-environments.qmd
    - resources.qmd

website:
  title: "Package Development in R"
  site-url: https://iqss.github.io/dss-rbuild/
  repo-url: https://github.com/IQSS/dss-rbuild
  page-navigation: true
  # The theme contributes the footer's left half; the license is this site's own.
  page-footer:
    right:
      - text: "GPL-3.0"
        href: https://github.com/IQSS/dss-rbuild/blob/main/LICENSE
  sidebar:
    style: floating
    search: true
    contents:
      - { href: index.qmd, text: "Introduction" }
      - package-development.qmd
      - version-control.qmd
      - integrated-development-environments.qmd
      - resources.qmd

format:
  dss-theme-html:
    include-in-header:
      # Search Console: the meta tag proves ownership of the URL-prefix property; the token is per Google
      # account, the same on every DSS site. Visitor counts: GoatCounter at dss-rbuild.goatcounter.com; a page
      # view is recorded with its path, title and referrer, no cookie, nothing that identifies the reader.
      # Adding #toggle-goatcounter to any iqss.github.io address switches counting off in that browser.
      - text: |
          <meta name="google-site-verification" content="yQHSXWQVwOPIg4wRh9A8zusoTpcfgW05SWdbVN0rF-s">
          <script data-goatcounter="https://dss-rbuild.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>

execute:
  freeze: true
